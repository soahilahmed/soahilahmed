<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Sohail Ahmed - AI and Machine Learning Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0820"/>
      <stop offset="50%" stop-color="#2a1f6b"/>
      <stop offset="100%" stop-color="#0a2a43"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="24s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#7b6cff"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="reveal">
      <rect x="60" y="90" height="100" width="0">
        <animate attributeName="width" from="0" to="480" begin="0.4s" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="260" r="2" opacity=".5"><animateTransform attributeName="transform" type="translate" values="0 0;10 -260" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="280" r="1.5" opacity=".4"><animateTransform attributeName="transform" type="translate" values="0 0;-15 -280" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="270" r="2.5" opacity=".35"><animateTransform attributeName="transform" type="translate" values="0 0;20 -270" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="290" r="1.8" opacity=".5"><animateTransform attributeName="transform" type="translate" values="0 0;-10 -290" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="275" r="2" opacity=".4"><animateTransform attributeName="transform" type="translate" values="0 0;12 -275" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="290" r="1.6" opacity=".4"><animateTransform attributeName="transform" type="translate" values="0 0;8 -290" dur="13s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="#00f5d4" stroke-width="1" fill="none" opacity=".55" stroke-dasharray="4 6">
    <line x1="700" y1="70" x2="790" y2="120"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/></line>
    <line x1="700" y1="150" x2="790" y2="120"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="700" y1="150" x2="790" y2="190"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="700" y1="230" x2="790" y2="190"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="700" y1="70" x2="790" y2="190"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="700" y1="230" x2="790" y2="120"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.1s" repeatCount="indefinite"/></line>
    <line x1="790" y1="120" x2="880" y2="90"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/></line>
    <line x1="790" y1="120" x2="880" y2="170"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="790" y1="190" x2="880" y2="170"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="790" y1="190" x2="880" y2="240"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="880" y1="90" x2="950" y2="130"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/></line>
    <line x1="880" y1="170" x2="950" y2="130"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="880" y1="240" x2="950" y2="200"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="880" y1="170" x2="950" y2="200"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.7s" repeatCount="indefinite"/></line>
  </g>

  <g fill="#7b6cff" filter="url(#glow)">
    <circle cx="700" cy="70" r="6"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="150" r="6"><animate attributeName="r" values="5;8;5" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="230" r="6"><animate attributeName="r" values="5;8;5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="120" r="7" fill="#00f5d4"><animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="190" r="7" fill="#00f5d4"><animate attributeName="r" values="6;9;6" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="90" r="6" fill="#ff4fd8"><animate attributeName="r" values="5;8;5" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="170" r="6" fill="#ff4fd8"><animate attributeName="r" values="5;8;5" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="240" r="6" fill="#ff4fd8"><animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="130" r="7" fill="#ffffff"><animate attributeName="r" values="6;9;6" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="200" r="7" fill="#ffffff"><animate attributeName="r" values="6;9;6" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#reveal)">
    <text x="60" y="165" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="url(#tg)" textLength="470" lengthAdjust="spacingAndGlyphs" filter="url(#glow)">Sohail Ahmed</text>
  </g>

  <rect x="60" y="112" width="4" height="64" rx="2" fill="#00f5d4">
    <animate attributeName="x" from="60" to="534" begin="0.4s" dur="2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2.4s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" fill="#e8e8ff" letter-spacing="1">
    <text x="62" y="212" opacity="0">AI &amp; Machine Learning Engineer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="212" opacity="0">Building Intelligent Systems
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="212" opacity="0">Turning Data into Decisions
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.94;1" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="62" y="228" height="4" rx="2" fill="url(#tg)" width="0" filter="url(#glow)">
    <animate attributeName="width" values="0;260;260" keyTimes="0;0.4;1" dur="3s" begin="0.4s" fill="freeze"/>
  </rect>

  <path fill="#7b6cff" opacity=".25" d="M0,262 q125,-30 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V300 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#00f5d4" opacity=".18" d="M0,272 q125,28 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V300 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path fill="#0b0820" opacity=".7" d="M0,284 q125,-18 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V300 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
